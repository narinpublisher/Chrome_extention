<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Synced To-Do List</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>My Tasks</h1>
  </header>
  <main>
    <form id="task-form">
      <input
        type="text"
        id="task-input"
        placeholder="Add a task..."
        autocomplete="off">
      <button type="submit">Add</button>
    </form>
    <ul id="task-list"></ul>
  </main>
</body>
</html>
